services:
  hands-detection:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fqe-hands-detection
    restart: unless-stopped
    ports:
      - "50051:50051"
    networks:
      - default
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

networks:
  gateway:
    external: true
    name: figurasqe-gateway_default
