services:
  microservicio-figuras:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fqe-microservicio-figuras
    restart: unless-stopped
    ports:
      - "5124:5124"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5124
      ConnectionStrings__PostgresConnection: Host=host.docker.internal;Port=5432;Database=figurasqe;Username=postgres;Password=1234
      Jwt__Issuer: figurasqe-auth
      Jwt__Audience: figurasqe-client
      Jwt__Key: IG2xBsN8NQezECzk53BKN7TBE51Tc2LW83Fj66gntx43w8zDrs
      Service__Port: 5124
      Service__Endpoints__AuthService: http://host.docker.internal:5041
      Service__Endpoints__LogsService: http://host.docker.internal:5186
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5124/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
